<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMAnvil - Launching Soon</title>
    <meta name="description" content="BIMAnvil - The next-generation OpenBIM desktop platform. Coming soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050507;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --accent: #67E8F9;
            --accent-glow: rgba(103, 232, 249, 0.35);
            --primary: #0284C7;
            --font-heading: 'Outfit', 'Inter', -apple-system, sans-serif;
            --font-body: 'Inter', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            text-align: center;
            padding: 40px 20px;
        }

        /* Blueprint Vector Grid */
        .blueprint-grid {
            position: absolute;
            inset: 0;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 85%);
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 500px;
            background: radial-gradient(circle, rgba(103, 232, 249, 0.12) 0%, rgba(2, 132, 199, 0.04) 50%, transparent 75%);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Header Logo */
        header {
            z-index: 1;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #FFFFFF;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-heading);
            letter-spacing: -0.01em;
            text-decoration: none;
        }

        .logo img {
            height: 38px;
            border-radius: 6px;
        }

        .logo span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        /* Center Content */
        main {
            z-index: 1;
            max-width: 680px;
            margin: auto 0;
            padding: 20px 0;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(103, 232, 249, 0.08);
            border: 1px solid rgba(103, 232, 249, 0.25);
            border-radius: 50px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 55%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.12rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 36px;
        }

        /* Contact Action Box */
        .contact-box {
            background: rgba(13, 14, 21, 0.8);
            border: 1px solid rgba(103, 232, 249, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 16px 24px;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            flex-wrap: wrap;
            justify-content: center;
        }

        .contact-email {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 600;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-email i {
            color: var(--accent);
        }

        .btn-copy {
            background: linear-gradient(135deg, #67E8F9 0%, #0284C7 100%);
            color: #050507;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-copy:hover {
            background: linear-gradient(135deg, #A5F3FC 0%, #0EA5E9 100%);
            transform: translateY(-1px);
            box-shadow: 0 0 28px rgba(103, 232, 249, 0.6);
        }

        /* Footer */
        footer {
            z-index: 1;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1rem; }
            .contact-box { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="blueprint-grid"></div>
    <div class="ambient-glow"></div>

    <header>
        <div class="logo">
            <img src="assets/logo.png" alt="BIMAnvil Logo"> BIM<span>Anvil</span>
        </div>
    </header>

    <main>
        <div class="badge-pill">
            <span class="badge-dot"></span> Under Active Development
        </div>
        <h1>Something Powerful is Being Forged</h1>
        <p>We are currently finalizing major core engine enhancements and specialized BIM workspaces. Public access and downloads will open soon.</p>
        
        <div class="contact-box">
            <div class="contact-email">
                <i class="fas fa-envelope"></i> hello@bimanvil.com
            </div>
            <button class="btn-copy" id="copyBtn" aria-label="Copy Email">
                <i class="fas fa-copy"></i> <span id="btnText">Get in Touch</span>
            </button>
        </div>
    </main>

    <footer>
        &copy; 2026 BIMAnvil. All rights reserved.
    </footer>

    <script>
        const copyBtn = document.getElementById('copyBtn');
        const btnText = document.getElementById('btnText');
        if (copyBtn && btnText) {
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText('hello@bimanvil.com').then(() => {
                    btnText.textContent = 'Email Copied!';
                    copyBtn.style.background = '#10B981';
                    setTimeout(() => {
                        btnText.textContent = 'Get in Touch';
                        copyBtn.style.background = '';
                    }, 2500);
                }).catch(() => {
                    window.location.href = 'mailto:hello@bimanvil.com';
                });
            });
        }
    </script>
</body>
</html>
